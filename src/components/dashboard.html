<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Market Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { font-family: 'Consolas', 'Courier New', monospace; background: #0d0f12;
         color: #e2e8f0; font-size: 12px }
  .topbar { background: #111418; border-bottom: 1px solid #1e2530;
            padding: 10px 16px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0 }
  .topbar-title { font-size: 13px; font-weight: 600; letter-spacing: .06em;
                  color: #7dd3fc }
  .status { font-size: 11px; color: #94a3b8; display: flex; align-items: center;
            gap: 8px }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
         animation: pulse 1.5s infinite }
  .dot.off { background: #ef4444; animation: none }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  table { width: 100%; border-collapse: collapse }
  thead tr { background: #111418; position: sticky; top: 43px }
  th { padding: 8px 12px; text-align: right; color: #64748b; font-weight: 500;
       font-size: 11px; letter-spacing: .04em; border-bottom: 1px solid #1e2530;
       white-space: nowrap }
  th:first-child, th:nth-child(2) { text-align: left }
  td { padding: 9px 12px; text-align: right; border-bottom: 1px solid #171b22;
       white-space: nowrap }
  td:first-child, td:nth-child(2) { text-align: left; color: #cbd5e1; font-weight: 500 }
  tr:hover td { background: #131720 }
  .symbol-header td {
    background: #0f1720;
    color: #7dd3fc;
    font-weight: 700;
    text-align: left !important;
    letter-spacing: .04em;
    border-top: 1px solid #223042;
    border-bottom: 1px solid #223042;
    padding-top: 10px;
    padding-bottom: 10px;
  }

  .up { color: #4ade80 } .dn { color: #f87171 } .mt { color: #94a3b8 }
  .flash { animation: flash .4s ease-out }
  @keyframes flash { 0%{background:#1e3a2f} 100%{background:transparent} }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">LIVE MARKET MONITOR</div>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="conn-label">connecting…</span>
  </div>
</div>

<table>
  <thead><tr>
    <th>Symbol</th><th>Window (Candle Minutes)</th><th>Buy Volume %</th>
    <th>Sell Volume %</th><th>Delta %</th><th>Cum Delta</th><th>Cum Delta Change %</th><th>Signal</th>
  </tr></thead>
  <tbody id="tbody"></tbody>
</table>

<script>
const tbody = document.getElementById("tbody");
const symbolOrder = [];
const allowedSymbols = new Set();
const symbolGroups = new Map();

function fmt(n, dec) { return Number(n).toFixed(dec); }

function signalLabel(signal) {
  if (String(signal) === "1") return "BUY";
  if (String(signal) === "-1") return "SELL";
  return "NEUTRAL";
}

function isAllowedSymbol(symbol) {
  if (allowedSymbols.size === 0) return true;
  return allowedSymbols.has(symbol);
}

function ensureSymbolOrder(symbol) {
  if (!symbolOrder.includes(symbol)) symbolOrder.push(symbol);
}

function ensureGroup(symbol) {
  if (symbolGroups.has(symbol)) return symbolGroups.get(symbol);

  const header = document.createElement("tr");
  header.className = "symbol-header";
  header.dataset.group = symbol;
  header.innerHTML = `<td colspan="8">${symbol}</td>`;
  tbody.appendChild(header);
  symbolGroups.set(symbol, header);
  return header;
}

function reorderGroups() {
  const rowsBySymbol = new Map();
  Array.from(tbody.children).forEach(node => {
    if (node.classList && node.classList.contains("symbol-header")) return;
    const symbol = node.dataset?.group;
    if (!symbol) return;
    if (!rowsBySymbol.has(symbol)) rowsBySymbol.set(symbol, []);
    rowsBySymbol.get(symbol).push(node);
  });

  tbody.innerHTML = "";

  symbolOrder.forEach(symbol => {
    const header = ensureGroup(symbol);
    tbody.appendChild(header);
    const rows = rowsBySymbol.get(symbol) || [];
    rows.forEach(row => tbody.appendChild(row));
  });
}

function appendCandleRow(d) {
  if (!isAllowedSymbol(d.symbol)) return;
  ensureSymbolOrder(d.symbol);
  const groupHeader = ensureGroup(d.symbol);

  const buyPct = d.aggression.buy_percentage ?? 0;
  const sellPct = d.aggression.sell_percentage ?? 0;
  const deltaPct = d.aggression.delta_percentage ?? 0;
  const cumDelta = d.aggression.cum_delta ?? 0;
  const cumDeltaChangePct = d.aggression.cum_delta_change_percentage ?? 0;
  const signal = signalLabel(d.signal ?? "0");
  const window = `${d.candle_open || "--:--"}-${d.candle_close || "--:--"}`;

  const tr = document.createElement("tr");
  tr.dataset.group = d.symbol;
  tr.innerHTML = `
    <td></td>
    <td>${window}</td>
    <td>${fmt(buyPct, 4)}</td>
    <td>${fmt(sellPct, 4)}</td>
    <td>${(deltaPct >= 0 ? "+" : "") + fmt(deltaPct, 4)}</td>
    <td>${cumDelta}</td>
    <td>${(cumDeltaChangePct >= 0 ? "+" : "") + fmt(cumDeltaChangePct, 4)}%</td>
    <td>${signal}</td>
  `;

  // Keep the per-symbol live row always at the top (right after header).
  // Closed candles should stack below the live row.
  const liveRow = tbody.querySelector(`tr[data-live="1"][data-group="${d.symbol}"]`);
  const insertBeforeNode = liveRow ? liveRow.nextSibling : groupHeader.nextSibling;
  tbody.insertBefore(tr, insertBeforeNode);

  tr.classList.remove("flash");
  void tr.offsetWidth;
  tr.classList.add("flash");
}

function upsertLiveRow(d) {
  if (!isAllowedSymbol(d.symbol)) return;
  ensureSymbolOrder(d.symbol);
  const groupHeader = ensureGroup(d.symbol);

  const buyPct = d.aggression.buy_percentage ?? 0;
  const sellPct = d.aggression.sell_percentage ?? 0;
  const deltaPct = d.aggression.delta_percentage ?? 0;
  const cumDelta = d.aggression.cum_delta ?? 0;
  const cumDeltaChangePct = d.aggression.cum_delta_change_percentage ?? 0;
  const signal = signalLabel(d.signal ?? "0");
  const window = `${d.candle_open || "--:--"}-${d.candle_close || "--:--"}`;

  let tr = tbody.querySelector(`tr[data-live="1"][data-group="${d.symbol}"]`);
  if (!tr) {
    tr = document.createElement("tr");
    tr.dataset.group = d.symbol;
    tr.dataset.live = "1";
    tbody.insertBefore(tr, groupHeader.nextSibling);
  }

  tr.innerHTML = `
    <td></td>
    <td>${window}</td>
    <td>${fmt(buyPct, 4)}</td>
    <td>${fmt(sellPct, 4)}</td>
    <td>${(deltaPct >= 0 ? "+" : "") + fmt(deltaPct, 4)}</td>
    <td>${cumDelta}</td>
    <td>${(cumDeltaChangePct >= 0 ? "+" : "") + fmt(cumDeltaChangePct, 4)}%</td>
    <td>${signal}</td>
  `;

  tr.classList.remove("flash");
  void tr.offsetWidth;
  tr.classList.add("flash");
}

function applySymbols(msg) {
  if (!Array.isArray(msg.symbols)) return;
  allowedSymbols.clear();
  msg.symbols.forEach(s => {
    if (typeof s === "string" && s.trim()) {
      const sym = s.trim();
      allowedSymbols.add(sym);
      ensureSymbolOrder(sym);
      ensureGroup(sym);
    }
  });
  reorderGroups();
}

function connect() {
  const dot = document.getElementById("dot");
  const lbl = document.getElementById("conn-label");
  const es  = new EventSource("/events");

  es.onopen = () => {
    dot.classList.remove("off");
    lbl.textContent = "connected";
  };
  es.onerror = () => {
    dot.classList.add("off");
    lbl.textContent = "reconnecting…";
  };
  es.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === "symbols") applySymbols(msg);
      if (msg.type === "closed") appendCandleRow(msg);
      if (msg.type === "live") upsertLiveRow(msg);
      if (msg.type === "status") lbl.textContent = msg.text;
    } catch {}
  };
}

connect();
</script>
</body>
</html>
