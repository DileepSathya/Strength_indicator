<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Market Monitor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }
  body { font-family: 'Consolas', 'Courier New', monospace; background: #0d0f12;
         color: #e2e8f0; font-size: 12px }
  .topbar { background: #111418; border-bottom: 1px solid #1e2530;
            padding: 10px 16px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0 }
  .topbar-title { font-size: 13px; font-weight: 600; letter-spacing: .06em;
                  color: #7dd3fc }
  .status { font-size: 11px; color: #94a3b8; display: flex; align-items: center;
            gap: 8px }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
         animation: pulse 1.5s infinite }
  .dot.off { background: #ef4444; animation: none }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  table { width: 100%; border-collapse: collapse }
  thead tr { background: #111418; position: sticky; top: 43px }
  th { padding: 8px 12px; text-align: right; color: #64748b; font-weight: 500;
       font-size: 11px; letter-spacing: .04em; border-bottom: 1px solid #1e2530;
       white-space: nowrap }
  th:first-child, th:nth-child(2) { text-align: left }
  td { padding: 9px 12px; text-align: right; border-bottom: 1px solid #171b22;
       white-space: nowrap }
  td:first-child, td:nth-child(2) { text-align: left; color: #cbd5e1; font-weight: 500 }
  tr:hover td { background: #131720 }

  .up { color: #4ade80 } .dn { color: #f87171 } .mt { color: #94a3b8 }
  .flash { animation: flash .4s ease-out }
  @keyframes flash { 0%{background:#1e3a2f} 100%{background:transparent} }

  #log { padding: 12px 16px; border-top: 1px solid #1e2530; max-height: 260px;
         overflow-y: auto }
  .log-entry { font-size: 11px; color: #94a3b8; border-left: 2px solid #334155;
               padding: 4px 10px; margin-bottom: 6px }
  .log-entry .sym { color: #7dd3fc; font-weight: 600 }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">LIVE MARKET MONITOR</div>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="conn-label">connecting…</span>
  </div>
</div>

<table>
  <thead><tr>
    <th>Symbol</th><th>Timestamp</th><th>Aggression</th>
    <th>Buy %</th><th>Sell %</th><th>Signal</th>
  </tr></thead>
  <tbody id="tbody"></tbody>
</table>

<div id="log"><em style="color:#334155;font-size:11px">Closed candles will appear here…</em></div>

<script>
const SYMBOLS = [
  "NSE:ASIANPAINT-EQ",
  "NSE:HEROMOTOCO-EQ"
];

const tbody = document.getElementById("tbody");

function ensureRow(s) {
  if (document.getElementById("row-" + s)) return;

  if (!SYMBOLS.includes(s)) {
    SYMBOLS.push(s);
  }

  const tr = document.createElement("tr");
  tr.id = "row-" + s;
  tr.innerHTML = `
    <td>${s}</td>
    <td id="ts-${s}">—</td>
    <td id="agg-${s}">—</td>
    <td id="bpct-${s}">—</td>
    <td id="spct-${s}">—</td>
    <td id="sig-${s}">0</td>
  `;
  tbody.appendChild(tr);
}

SYMBOLS.forEach(ensureRow);

function clsAgg(v) {
  return v > 0.3 ? "up" : v < -0.3 ? "dn" : "mt";
}

function fmt(n, dec) { return Number(n).toFixed(dec); }

function applyLive(d) {
  const s = d.symbol;
  ensureRow(s);

  const agg = d.aggression.score;
  const buyPct = d.aggression.buy_percentage ?? 0;
  const sellPct = d.aggression.sell_percentage ?? 0;
  const signal = d.signal ?? "0";
  const ts = d.timestamp || "—";

  document.getElementById(`ts-${s}`).textContent = ts;

  const aggEl = document.getElementById(`agg-${s}`);
  aggEl.className = clsAgg(agg);
  aggEl.textContent = (agg >= 0 ? "+" : "") + fmt(agg, 4);

  document.getElementById(`bpct-${s}`).textContent = fmt(buyPct, 4);
  document.getElementById(`spct-${s}`).textContent = fmt(sellPct, 4);
  document.getElementById(`sig-${s}`).textContent = String(signal);

  const row = document.getElementById("row-" + s);
  row.classList.remove("flash");
  void row.offsetWidth;
  row.classList.add("flash");
}

function appendClosed(d) {
  ensureRow(d.symbol);
  const log = document.getElementById("log");
  if (log.querySelector("em")) log.innerHTML = "";
  const agg = d.aggression.score;
  const buyPct = d.aggression.buy_percentage ?? 0;
  const sellPct = d.aggression.sell_percentage ?? 0;
  const signal = d.signal ?? "0";
  const ts = d.timestamp || "—";
  const div = document.createElement("div");
  div.className = "log-entry";
  div.innerHTML =
    `<span class="sym">${d.symbol}</span>  ${ts}  ` +
    `aggression:${(agg >= 0 ? "+" : "") + Number(agg).toFixed(4)}  ` +
    `buy_percentage:${Number(buyPct).toFixed(4)}  ` +
    `sell_percentage:${Number(sellPct).toFixed(4)}  ` +
    `signal:${signal}`;
  log.prepend(div);
}

function connect() {
  const dot = document.getElementById("dot");
  const lbl = document.getElementById("conn-label");
  const es  = new EventSource("/events");

  es.onopen = () => {
    dot.classList.remove("off");
    lbl.textContent = "connected";
  };
  es.onerror = () => {
    dot.classList.add("off");
    lbl.textContent = "reconnecting…";
  };
  es.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === "live") applyLive(msg);
      if (msg.type === "closed") appendClosed(msg);
      if (msg.type === "status") lbl.textContent = msg.text;
    } catch {}
  };
}

connect();
</script>
</body>
</html>
